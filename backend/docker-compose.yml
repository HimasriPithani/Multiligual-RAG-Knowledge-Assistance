version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=rag_assistant
      - CHROMA_PATH=/app/data/chroma
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo

  # Free, local MongoDB — no Atlas signup needed if you use this.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
